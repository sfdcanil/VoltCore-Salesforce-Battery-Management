<template>
    <section class="order-container">

        <div class="order-header">
            <div>
                <div class="eyebrow">VOLTCORE DEALER PORTAL</div>
                <h1>Place New Order</h1>
                <p>
                    Select the products you need and enter the required quantity.
                </p>
            </div>

            <button
                class="close-button"
                type="button"
                onclick={handleClose}
                title="Close">
                ×
            </button>
        </div>

        <template if:true={errorMessage}>
            <div class="error-banner">
                <span class="error-icon">!</span>
                <span>{errorMessage}</span>
            </div>
        </template>

        <template if:true={successMessage}>
            <div class="success-container">

                <div class="success-icon">?</div>

                <h2>Order Submitted Successfully</h2>

                <p>
                    Your order has been created successfully.
                </p>

                <div class="success-details">

                    <div class="success-detail">
                        <span class="detail-label">Opportunity</span>
                        <span class="detail-value">
                            {submittedOpportunityName}
                        </span>
                    </div>

                    <div class="success-detail">
                        <span class="detail-label">Products</span>
                        <span class="detail-value">
                            {submittedProductCount}
                        </span>
                    </div>

                    <div class="success-detail">
                        <span class="detail-label">Order Total</span>
                        <span class="detail-value">
                            {submittedAmount}
                        </span>
                    </div>

                </div>

                <button
                    class="primary-button"
                    type="button"
                    onclick={handlePlaceAnotherOrder}>
                    Place Another Order
                </button>

            </div>
        </template>

        <template if:true={isLoading}>
            <div class="loading-container">
                <lightning-spinner
                    alternative-text="Loading products"
                    size="medium">
                </lightning-spinner>

                <p>Loading available products...</p>
            </div>
        </template>

        <template if:true={showEmptyState}>
            <div class="empty-container">
                <div class="empty-icon">!</div>

                <h2>No Products Available</h2>

                <p>
                    There are currently no products available for ordering.
                </p>
            </div>
        </template>

        <template if:true={hasProducts}>
            <template if:false={successMessage}>

                <div class="product-section">

                    <div class="section-title">

                        <div>
                            <h2>Available Products</h2>
                            <p>
                                Select the products you want to order.
                            </p>
                        </div>

                        <div class="selected-count">
                            {selectedProductCount} selected
                        </div>

                    </div>

                    <div class="product-grid">

                        <template
                            for:each={products}
                            for:item="product">

                            <article
                                key={product.productId}
                                class="product-card">

                                <div class="product-top">

                                    <label class="checkbox-wrapper">

                                        <input
                                            type="checkbox"
                                            data-product-id={product.productId}
                                            checked={product.selected}
                                            onchange={handleProductSelection}
                                        />

                                        <span class="custom-checkbox"></span>

                                    </label>

                                    <div class="product-info">

                                        <h3>
                                            {product.productName}
                                        </h3>

                                        <template if:true={product.productCode}>
                                            <p class="product-code">
                                                Code: {product.productCode}
                                            </p>
                                        </template>

                                    </div>

                                </div>

                                <div class="product-price">

                                    <span class="price-label">
                                        Unit Price
                                    </span>

                                    <span class="price-value">
                                        {product.unitPrice}
                                    </span>

                                </div>

                                <div class="quantity-section">

                                    <label class="quantity-label">
                                        Quantity
                                    </label>

                                    <input
                                        class="quantity-input"
                                        type="number"
                                        min="1"
                                        max="100000"
                                        step="1"
                                        value={product.quantity}
                                        data-product-id={product.productId}
                                        onchange={handleQuantityChange}
                                        disabled={product.quantityDisabled}
                                    />

                                    <template if:false={product.selected}>
                                        <span class="quantity-help">
                                            Select product to enter quantity
                                        </span>
                                    </template>

                                </div>

                                <template if:true={product.selected}>
                                    <div class="line-total">
                                        <span>Line Total</span>
                                        <strong>{product.lineTotal}</strong>
                                    </div>
                                </template>

                            </article>

                        </template>

                    </div>
                </div>

                <div class="order-summary">

                    <div class="summary-left">

                        <span class="summary-label">
                            Order Summary
                        </span>

                        <span class="summary-items">
                            {selectedProductCount} product(s)
                            ·
                            {totalQuantity} unit(s)
                        </span>

                    </div>

                    <div class="summary-right">

                        <div class="total-block">

                            <span class="total-label">
                                Estimated Total
                            </span>

                            <strong class="total-value">
                                {formattedOrderTotal}
                            </strong>

                        </div>

                        <button
                            class="primary-button submit-button"
                            type="button"
                            onclick={handleSubmit}
                            disabled={disableSubmit}>

                            <template if:true={isSubmitting}>
                                <span>Submitting...</span>
                            </template>

                            <template if:false={isSubmitting}>
                                <span>Submit Order</span>
                            </template>

                        </button>

                    </div>

                </div>

            </template>
        </template>

    </section>
</template>
