<template>

    <section class="lead-form">

        <div class="form-container">

            <!-- =========================
                 HEADER
                 ========================= -->

            <h1 class="form-title">
                Become a VoltCore Dealer
            </h1>

            <p class="form-description">
                Interested in becoming a VoltCore Batteries dealer?
                Submit your details and our team will contact you.
            </p>


            <!-- =========================
                 LEAD FORM
                 ========================= -->

            <lightning-record-edit-form
                object-api-name="Lead"
                onsuccess={handleSuccess}
                onerror={handleError}>

                <div class="form-grid">

                    <!-- FIRST NAME -->
                    <div class="field-wrapper">

                        <label class="field-label">
                            First Name
                        </label>

                        <lightning-input-field
                            field-name="FirstName"
                            variant="label-hidden">
                        </lightning-input-field>

                    </div>


                    <!-- LAST NAME -->
                    <div class="field-wrapper">

                        <label class="field-label">
                            <span class="required">*</span>
                            Last Name
                        </label>

                        <lightning-input-field
                            field-name="LastName"
                            variant="label-hidden"
                            required>
                        </lightning-input-field>

                    </div>


                    <!-- EMAIL -->
                    <div class="field-wrapper">

                        <label class="field-label">
                            <span class="required">*</span>
                            Email
                        </label>

                        <lightning-input-field
                            field-name="Email"
                            variant="label-hidden"
                            required>
                        </lightning-input-field>

                    </div>


                    <!-- PHONE -->
                    <div class="field-wrapper">

                        <label class="field-label">
                            <span class="required">*</span>
                            Phone
                        </label>

                        <lightning-input-field
                            field-name="Phone"
                            variant="label-hidden"
                            required>
                        </lightning-input-field>

                    </div>


                    <!-- COMPANY -->
                    <div class="field-wrapper">

                        <label class="field-label">
                            <span class="required">*</span>
                            Company Name
                        </label>

                        <lightning-input-field
                            field-name="Company"
                            variant="label-hidden"
                            required>
                        </lightning-input-field>

                    </div>


                    <!-- PAN NUMBER -->
                    <div class="field-wrapper">

                        <label class="field-label">
                            <span class="required">*</span>
                            PAN Number
                        </label>

                        <lightning-input-field
                            field-name="PAN_Number__c"
                            variant="label-hidden"
                            required>
                        </lightning-input-field>

                    </div>


                    <!-- GSTN NUMBER -->
                    <div class="field-wrapper">

                        <label class="field-label">
                            <span class="required">*</span>
                            GSTIN
                        </label>

                        <lightning-input-field
                            field-name="GSTIN__c"
                            variant="label-hidden"
                            required>
                        </lightning-input-field>

                    </div>


                    <!-- CITY -->
                    <div class="field-wrapper">

                        <label class="field-label">
                            <span class="required">*</span>
                            City
                        </label>

                        <lightning-input-field
                            field-name="City"
                            variant="label-hidden"
                            required>
                        </lightning-input-field>

                    </div>


                    <!-- STATE -->
                    <div class="field-wrapper">

                        <label class="field-label">
                            <span class="required">*</span>
                            State / Province
                        </label>

                        <lightning-input-field
                            field-name="State"
                            variant="label-hidden"
                            required>
                        </lightning-input-field>

                    </div>


                    <!-- COUNTRY -->
                    <div class="field-wrapper">

                        <label class="field-label">
                            <span class="required">*</span>
                            Country
                        </label>

                        <lightning-input-field
                            field-name="Country"
                            variant="label-hidden"
                            required>
                        </lightning-input-field>

                    </div>


                    <!-- PINCODE -->
                    <div class="field-wrapper">

                        <label class="field-label">
                            <span class="required">*</span>
                            Pincode
                        </label>

                        <lightning-input-field
                            field-name="PostalCode"
                            variant="label-hidden"
                            required>
                        </lightning-input-field>

                    </div>

                </div>


                <!-- =========================
                     SUBMIT BUTTON
                     ========================= -->

                <div class="submit-container">

                    <button
                        type="submit"
                        class="submit-button">

                        Submit Dealer Enquiry

                    </button>

                </div>


                <!-- =========================
                     SUCCESS MESSAGE
                     ========================= -->

                <template if:true={successMessage}>

                    <div class="success-message">
                        {successMessage}
                    </div>

                </template>


                <!-- =========================
                     ERROR MESSAGE
                     ========================= -->

                <template if:true={errorMessage}>

                    <div class="error-message">
                        {errorMessage}
                    </div>

                </template>

            </lightning-record-edit-form>

        </div>

    </section>

</template>
