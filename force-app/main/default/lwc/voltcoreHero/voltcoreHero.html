<template>

    <section class="hero-section">

        <div class="hero-content">


            <!-- =========================================
                 LEFT SIDE - HERO CONTENT
                 ========================================= -->

            <div class="hero-text">

                <p class="eyebrow">
                    POWERING THE FUTURE
                </p>


                <h1>
                    POWERING EVERY
                    <br />
                    <span>JOURNEY.</span>
                </h1>


                <p class="hero-description">
                    Reliable energy. Powerful performance.
                    Built for the road ahead.
                </p>


                <!-- =====================================
                     BECOME A DEALER
                     ===================================== -->

                <div class="hero-actions">

                    <a
                        href="/Dealer/become-a-dealer"
                        class="dealer-button">

                        Become a Dealer

                        <span class="arrow">
                            →
                        </span>

                    </a>

                </div>

            </div>


            <!-- =========================================
                 RIGHT SIDE - IMAGE CAROUSEL
                 ========================================= -->

            <div
                class="hero-visual"
                onmouseenter={stopCarousel}
                onmouseleave={startCarousel}>

                <div class="carousel-container">


                    <!-- =================================
                         CAROUSEL SLIDES
                         ================================= -->

                    <template
                        for:each={slides}
                        for:item="slide">

                        <div
                            key={slide.id}
                            class="carousel-slide">

                            <img
                                src={slide.image}
                                alt={slide.alt}
                                class="hero-image"
                            />

                        </div>

                    </template>


                    <!-- =================================
                         PREVIOUS BUTTON
                         ================================= -->

                    <button
                        type="button"
                        class="carousel-arrow previous"
                        onclick={previousSlide}
                        aria-label="Previous image">

                        <span>‹</span>

                    </button>


                    <!-- =================================
                         NEXT BUTTON
                         ================================= -->

                    <button
                        type="button"
                        class="carousel-arrow next"
                        onclick={nextSlide}
                        aria-label="Next image">

                        <span>›</span>

                    </button>


                    <!-- =================================
                         CAROUSEL DOTS
                         ================================= -->

                    <div class="carousel-dots">


                        <!-- SLIDE 1 -->

                        <button
                            type="button"
                            class="carousel-dot active"
                            data-index="0"
                            onclick={goToSlide}
                            aria-label="Go to slide 1">
                        </button>


                        <!-- SLIDE 2 -->

                        <button
                            type="button"
                            class="carousel-dot"
                            data-index="1"
                            onclick={goToSlide}
                            aria-label="Go to slide 2">
                        </button>


                        <!-- SLIDE 3 -->

                        <button
                            type="button"
                            class="carousel-dot"
                            data-index="2"
                            onclick={goToSlide}
                            aria-label="Go to slide 3">
                        </button>


                        <!-- SLIDE 4 -->

                        <button
                            type="button"
                            class="carousel-dot"
                            data-index="3"
                            onclick={goToSlide}
                            aria-label="Go to slide 4">
                        </button>


                        <!-- SLIDE 5 -->

                        <button
                            type="button"
                            class="carousel-dot"
                            data-index="4"
                            onclick={goToSlide}
                            aria-label="Go to slide 5">
                        </button>


                    </div>

                </div>

            </div>

        </div>

    </section>

</template>
